<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard</title>
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/wrapper.css">
    <link rel="stylesheet" href="../../css/nav.css">
</head>
<body>
    <div class="wrapper">

        <nav>
            <h1>Vendor Dashboard</h1>
            <div>
                <!-- <a id="menuBtn">Menu</a>
                <a class="">Add Product</a> -->
            </div>
            <button id="logoutBtn">Logout</button>
        </nav>

        <main>
            <div>
                <h2>Welcome, <span id="shopNameDisplay">Vendor</span>!</h2>
                <p>This is your dashboard where you can manage your products and view orders.</p>
            </div>

            <div id="shopNameDiv" class="d-none">
                <input id="shopNameInput" type="text" placeholder="Enter Shop Name">
                <button id="saveShopNameBtn">Save Shop Name</button>
            </div>

            <div id="productDetailsDiv" class="d-none">
                <input id="productName" type="text" placeholder="Add Product Name">
                <input id="productPrice" type="text" placeholder="Add Product Price">
                <input id="productImage" type="file" placeholder="Add Product Image">
                <button id="addProductBtn">Add New Product</button>
            </div>

            <div id="productsDiv" class="d-none"></div>
        </main>

        

    </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script type="module" src="./vendor.js"></script>

</html>
